name: CI

on:
  push:
    branches: [main]
    paths:
      - "discord/**"
  pull_request:
    branches: [main]
    paths:
      - "discord/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: discord

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      # Node.js 25+ no longer bundles Corepack; install it so pnpm still follows
      # the packageManager field in package.json.
      - name: Enable Corepack
        run: npm install --global corepack@0.36.0 && corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
